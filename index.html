<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Katalog Menu</title>
  <link rel="icon" type="image/png" href="book.ico"/>
  <meta name="description" content="Katalog link statis untuk GitHub Pages">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="container">
    <header class="site-header">
      <p class="eyebrow">GitHub Pages Ready</p>
      <h1>Katalog Menu</h1>
    </header>

    <section id="catalogSection" aria-labelledby="catalogTitle">
      <div class="section-heading">
        <h2 id="catalogTitle">Daftar Katalog</h2>
        <button id="resetPublicBtn" class="btn btn-secondary" type="button" title="Sinkronisasi dari server online">Sync Data Online</button>
      </div>

      <div class="toolbar">
        <label class="search-label" for="searchInput">Cari</label>
        <input id="searchInput" type="search" placeholder="Cari nama atau URL...">
      </div>

      <div id="catalogContainer" class="catalog-grid" aria-live="polite"></div>
    </section>
  </main>

  <footer class="footer">
    <span>Static Katalog JSON • GitHub Pages</span>
  </footer>

  <script src="./app.js" defer></script>
</body>
</html>
